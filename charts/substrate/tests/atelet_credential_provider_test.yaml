suite: atelet credential-provider plugins from images
templates:
- atelet.yaml
release:
  name: substrate
  namespace: ate-system
values:
- ./values/credential-provider-plugins.yaml
tests:
- it: installs each plugin from its image into an emptyDir and passes both flags
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.spec.initContainers[0].name
      value: credential-provider-dockerconfig-credential-provider
  - equal:
      path: spec.template.spec.initContainers[0].args
      value: ["install", "/run/image-credential-provider/bin"]
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-credential-provider-bin-dir=/run/image-credential-provider/bin
  - contains:
      path: spec.template.spec.volumes
      content:
        name: image-credential-provider-bin
        emptyDir: {}
- it: mounts the plugin Secrets read-only
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: image-credential-registry
        mountPath: /run/image-credential-provider/secrets/registry
        readOnly: true
  - contains:
      path: spec.template.spec.volumes
      content:
        name: image-credential-registry
        secret:
          secretName: atelet-registry-auth
          optional: true
          items:
          - key: .dockerconfigjson
            path: config.json
- it: refuses plugins together with a node bin directory
  set:
    atelet.imageCredentialProviderBinDir: /home/kubernetes/bin
  asserts:
  - failedTemplate:
      errorPattern: set only one of atelet.imageCredentialProviderPlugins
